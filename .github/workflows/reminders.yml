name: Pick reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification to everyone with reminders on"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: reminders

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --omit=dev
      - run: node reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
      # Public repositories pause scheduled jobs after 60 days without changes; this keeps it running.
      - uses: gautamkrishnar/keepalive-workflow@v2
        if: github.event_name == 'schedule'
